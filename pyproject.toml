[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panelbl"
version = "1.0.0"
description = "Coupled panel / integral-boundary-layer airfoil solver, with a verification and validation campaign against XFOIL"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ian Stanojevic" }]
keywords = ["aerodynamics", "panel method", "boundary layer", "verification", "validation", "CFD"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
study = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/ianstanojevic/airfoil-vv"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["network: needs airfoiltools.com (skipped when the cache is cold and offline)"]
